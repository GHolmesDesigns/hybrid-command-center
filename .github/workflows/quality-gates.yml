name: Quality gates

# Two triggers, and between them they cover everything that can reach `main`: the pull-request
# event gates `refs/pull/N/merge`, which is the tree that will actually land, and the push event
# gates each merge commit once it has. `push` used to be unrestricted, which meant a commit on a
# card branch with an open pull request ran the whole gate twice on the same tree — and the
# Windows job bills at 2x, so the duplicate was the expensive half of ~30 billable minutes per
# commit. What is deliberately not covered: a branch pushed before its pull request exists. Under
# `AGENTS.md` a card opens its pull request as a draft from the first push, so that window is the
# exception rather than the flow.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# Pushing twice to a branch used to run both sets of gates to completion, and the answer from
# the superseded commit was thrown away on arrival. The Windows end-to-end job is the expensive
# one to waste. Keyed on the ref, which is now one group per branch: a card branch is reached
# only through `refs/pull/N/merge` and `main` only through `refs/heads/main`, so a superseded
# commit is cancelled by its successor without a second trigger racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Except on the default branch: a push there is a merge, and every merge commit keeps its own
  # recorded result rather than being cancelled by the next one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Gate shape: pay the small Ubuntu setup cost once before either browser job starts. Audit,
# typecheck, lint, formatting, and the existing version rule are the cheap verdicts; if one fails,
# both expensive jobs stop here. After they pass, Linux and Windows end-to-end work fans out in
# parallel, so a coverage, build, or Linux browser failure does not hide the Windows-only hang
# signal. Leaving both old jobs independent was rejected because Windows kept billing after a fast
# failure had already decided the run. Making Windows need the whole Linux job was rejected because
# it would defer every Windows-only finding until coverage, build, and Linux E2E were green.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # Actions are pinned to a commit SHA rather than a floating major tag: a tag is mutable
      # and a compromised one would run with the repository checked out and the npm cache in
      # reach. The trailing comment is the human-readable version, and it is what Dependabot
      # rewrites when it bumps the SHA.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `origin/main` resolves. The version-bump gate compares against
          # the base branch tip, and a shallow checkout has no such ref to compare against —
          # the check would skip itself and report success without having looked.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking, like every gate around it, and deliberately so: the lockfile is clean at
      # `high` today, so this starts green and only goes red on a genuinely new advisory. A
      # report-only step would be a line of log nobody reads, which is the failure this card
      # was written against. `high` is the threshold because a low or moderate advisory in the
      # build toolchain is noise on an app that feeds no untrusted input through Vite or
      # Playwright. When a high-severity advisory lands with no fix published, the deliberate
      # move is to record that exemption here by advisory id — not to lower the threshold.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Prettier is the house format and `npm run format` rewrites to it, but nothing was
      # checking that it had been run.
      - name: Check formatting
        run: npm run format:check

      # Draft PRs deliberately carry a per-issue changelog fragment and do not claim a version.
      # Once review is complete, the merge owner refreshes main, finalizes the version and
      # changelog, removes the fragment, and marks the PR ready. Enforce the version then and on
      # main; branch-push runs defer to the corresponding pull_request run because push events do
      # not expose draft state.
      - name: Check the version was bumped
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        run: npm run check:version-bump

  quality-gates:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Coverage is measured on this run rather than in a job of its own — the same suite,
      # the same checkout, one flag. The thresholds in `vitest.config.ts` are per project and
      # were taken from what this suite actually covers, so a module losing its tests fails
      # here instead of passing quietly.
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      # Blocking, like every gate above it: a red E2E run fails the job and the pull request.
      - name: Run end-to-end tests
        id: e2e
        run: npm run test:e2e
        timeout-minutes: 10

      # Only when the browser run itself failed, so an earlier gate going red does not attach
      # an empty archive. A failed browser run is unreadable from a log alone; the report
      # carries the traces and the error context files with it.
      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Linux cannot catch the Windows-only hang where Playwright prints a passing
  # summary and then never returns. This job is that check: after the shared fast
  # verdict is green, the suite on Windows must exit on its own. It deliberately
  # does not wait for the slow Linux job, so both platforms still report together.
  e2e-windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Run end-to-end tests
        id: e2e
        run: npm run test:e2e
        timeout-minutes: 5

      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7
