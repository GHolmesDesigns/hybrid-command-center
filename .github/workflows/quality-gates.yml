name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so `origin/main` resolves. The version-bump gate compares against
          # the base branch tip, and a shallow checkout has no such ref to compare against —
          # the check would skip itself and report success without having looked.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Prettier is the house format and `npm run format` rewrites to it, but nothing was
      # checking that it had been run.
      - name: Check formatting
        run: npm run format:check

      # "Every merged card ships a version bump" was a rule with no enforcement: the script
      # that checks it existed and ran nowhere. Two cards cut from the same commit can both
      # bump correctly and both land on the same number, and only this catches the second.
      - name: Check the version was bumped
        run: npm run check:version-bump

      - name: Run unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      # Blocking, like every gate above it: a red E2E run fails the job and the pull request.
      - name: Run end-to-end tests
        id: e2e
        run: npm run test:e2e
        timeout-minutes: 10

      # Only when the browser run itself failed, so an earlier gate going red does not attach
      # an empty archive. A failed browser run is unreadable from a log alone; the report
      # carries the traces and the error context files with it.
      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Linux cannot catch the Windows-only hang where Playwright prints a passing
  # summary and then never returns. This job is that check: the suite, on Windows,
  # must exit on its own.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Run end-to-end tests
        id: e2e
        run: npm run test:e2e
        timeout-minutes: 5

      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7
