name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      # Blocking, like every gate above it: a red E2E run fails the job and the pull request.
      - name: Run end-to-end tests
        id: e2e
        run: npm run test:e2e
        timeout-minutes: 10

      # Only when the browser run itself failed, so an earlier gate going red does not attach
      # an empty archive. A failed browser run is unreadable from a log alone; the report
      # carries the traces and the error context files with it.
      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
