<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Label preview</title>
  </head>
  <body>
    <div id="root" class="ghd-stage"></div>
    <script>
      var G = window.GHolmes,
        h = React.createElement,
        F = React.Fragment;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'ghd-stack' },
          h(G.Label, { tone: 'muted' }, 'The brand promise'),
          h(G.Label, { tone: 'ink' }, 'HEX #00A0F0 · RGB 0 160 240'),
          h(G.Label, { tone: 'highlight' }, '01'),
          h(G.Label, { tone: 'muted', size: 'sm' }, 'G.Holmes Designs — Brand guide'),
        ),
      );
    </script>
  </body>
</html>
